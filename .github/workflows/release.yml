name: Marketplace Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: xvfb-run -a npm test
      - run: npm run package:vsix
      - name: Select release tag
        id: version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag the release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath ./*.vsix --skip-duplicate -p "$VSCE_PAT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: '*.vsix'
